services:
  server:
    build:
      context: ./server
    container_name: nexus_server
    ports:
      - "5004:5004"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5004
        BACKEND_URL: http://localhost:5004
    container_name: nexus_client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: nexus_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: